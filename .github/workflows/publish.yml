name: publish

# Publishes to npm. `prepublishOnly` in package.json runs typecheck, tests and
# build before the upload, so a tag can never ship a tree that does not compile
# or pass — the gate lives in the package rather than only in this file, which
# means it also protects a publish run by hand from a laptop.
#
# Requires an `NPM_TOKEN` repository secret: an npm automation token with
# publish rights. Without it the run fails loudly at the publish step rather
# than succeeding having uploaded nothing.
on:
  # A pushed `v*` tag is the primary trigger, and the reason is mundane: a
  # release can only be created by something holding release permission, while
  # a tag can be pushed by anyone who can already push code. Making the tag
  # authoritative means cutting a version needs no capability beyond the one
  # required to write the version bump in the first place.
  push:
    tags: ['v*']
  # A published release still triggers it, so the two ways of cutting a version
  # agree. GitHub's own "create release from tag" flow pushes the tag first, so
  # the guard below has to tolerate seeing the same version twice — it does:
  # npm refuses a version that already exists, which turns the second run into
  # a loud no-op rather than a silent double publish.
  release:
    types: [published]
  # Manual re-run, for a version whose publish failed on something transient.
  # It republishes whatever is on the default branch, so the version guard
  # below does not apply — again, npm itself is the backstop.
  workflow_dispatch:

permissions:
  contents: read
  # Lets `npm publish --provenance` mint a signed attestation linking the
  # tarball to this workflow run and commit. A package about assurance should
  # be able to show where its own artefact came from.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          # Points npm at the public registry and writes the auth token into
          # the generated .npmrc. Without this, NODE_AUTH_TOKEN is ignored.
          registry-url: 'https://registry.npmjs.org'

      - name: Install deps
        run: npm ci

      - name: Tag must match package.json version
        if: github.event_name != 'workflow_dispatch'
        env:
          # `github.ref_name` is the tag on a tag push; the release event
          # carries its own tag name. One of the two is always set here, and
          # `workflow_dispatch` — where neither is meaningful — is excluded
          # above rather than allowed to fall through to an empty string.
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag=${TAG#v}
          if [ -z "$tag" ]; then
            echo "No tag name on a ${{ github.event_name }} event; refusing to guess." >&2
            exit 1
          fi
          if [ "$pkg" != "$tag" ]; then
            echo "Tag '$TAG' does not match package.json version '$pkg'." >&2
            echo "Bump the version and retag, rather than publishing one under the other's name." >&2
            exit 1
          fi
          echo "Publishing $pkg from tag $TAG."

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
